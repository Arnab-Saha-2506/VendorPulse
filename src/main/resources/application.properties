spring.application.name=VendorPulse
server.port=${PORT:2021}

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/VendorPulseDB}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

jwt.secret=VendorPulseSuperSecureSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

file.upload-dir=uploads

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:user}
spring.mail.password=${SMTP_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false